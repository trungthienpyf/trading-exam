
name: PHP Security Lab

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    name: Run PHP Security Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout current repository
        uses: actions/checkout@v4

      - name: Clone PHP security lab
        run: |
          git clone https://github.com/ikow/php2shell-poc.git security-lab
          test -d security-lab/lab
          test -d security-lab/poc

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f security-lab/requirements.txt ]; then
            pip install -r security-lab/requirements.txt
          fi

          if [ -f security-lab/poc/requirements.txt ]; then
            pip install -r security-lab/poc/requirements.txt
          fi

      - name: Validate Docker Compose
        working-directory: security-lab/lab
        run: docker compose config -q

      - name: Start isolated lab
        working-directory: security-lab/lab
        run: |
          docker compose up -d
          sleep 5
          docker compose ps

      - name: Run security verification tests
        shell: bash
        run: |
          set +e
          failed=0

          run_test() {
            name="$1"
            shift

            echo "::group::$name"
            timeout 120s "$@"
            rc=$?
            echo "Exit code: $rc"
            echo "::endgroup::"

            if [ "$rc" -ne 0 ]; then
              failed=1
            fi
          }

          run_test "Session injection verification" \
            python security-lab/poc/verify_session_injection.py \
            --target https://tieulong2.net/

          run_test "Handler mismatch verification" \
            python security-lab/poc/verify_handler_mismatch.py \
            --target https://tieulong2.net/

          run_test "OOM trigger verification" \
            python security-lab/poc/verify_oom_trigger.py \
            --host https://tieulong2.net/

          run_test "FPM stale state verification" \
            python security-lab/poc/verify_fpm_stale_state.py \
            --target https://tieulong2.net/

          exit "$failed"

      - name: Collect lab logs
        if: always()
        working-directory: security-lab/lab
        run: |
          docker compose logs --no-color || true

      - name: Stop and remove lab containers
        if: always()
        working-directory: security-lab/lab
        run: |
          docker compose down --volumes --remove-orphans || true
